name: Mozzart Scraper

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright openpyxl
          playwright install chromium

      - name: Run script
        run: python mozzart_human.py

      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: matches-json
          path: matches.json

      - name: Upload XLSX
        uses: actions/upload-artifact@v4
        with:
          name: matches-xlsx
          path: matches.xlsx
