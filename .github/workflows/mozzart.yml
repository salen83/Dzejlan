name: Mozzart Future Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # svakih 6 sati

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install playwright pandas openpyxl
          playwright install chromium

      - name: Run scraper
        run: |
          python mozzart_future.py

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mozzart-future-excel
          path: mozzart_future.xlsx
